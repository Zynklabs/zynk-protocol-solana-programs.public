[package]
name = "zynk-core"
version = "4.1.0"
description = "Zynk Protocol's Core Solana Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zynk_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
